name: Regression CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  CUDA_VISIBLE_DEVICES: ""

jobs:
  core:
    name: Core / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install core dependencies and package
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Check required imports
        run: |
          python -c 'import kvpilot, numpy, pytest; print("NumPy", numpy.__version__, "pytest", pytest.__version__)'
      - name: Run all available tests
        run: python -m pytest -q -ra --junitxml=artifacts/tests.xml
      - name: Record installed dependencies
        if: always()
        run: |
          mkdir -p artifacts
          python -m pip freeze > artifacts/dependencies.txt
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-python-${{ matrix.python }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  torch-cpu:
    name: Owned runner / CPU Torch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            experiments/torch/requirements.txt
            .github/workflows/ci.yml
      - name: Install CPU-only tensor engine
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install runner dependencies and package
        run: |
          python -m pip install -r requirements-ci.txt -r experiments/torch/requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Require every tensor-runner dependency
        run: |
          python - <<'PY'
          import numpy
          import psutil
          import safetensors.torch
          import tokenizers
          import torch
          from experiments.torch.qwen_runner import QwenRunner

          assert torch.__version__.split("+")[0] == "2.7.1", torch.__version__
          assert torch.version.cuda is None, "CI must use the CPU wheel"
          torch.testing.assert_close(torch.eye(2) @ torch.ones(2), torch.ones(2))
          print("Required imports and CPU tensor arithmetic passed:", torch.__version__)
          PY
      - name: Run full suite including tiny real tensor benchmarks
        run: python -m pytest -q -ra --junitxml=artifacts/tests.xml
      - name: Record installed dependencies
        if: always()
        run: |
          mkdir -p artifacts
          python -m pip freeze > artifacts/dependencies.txt
      - name: Upload tensor-runner test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: torch-cpu-python-3.11
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  evidence:
    name: Recorded evidence audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install core dependencies for summary recomputation
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Audit committed benchmark records without running inference
        run: python scripts/check_regression_evidence.py --output artifacts/evidence-audit.json
      - name: Record installed dependencies
        if: always()
        run: |
          mkdir -p artifacts
          python -m pip freeze > artifacts/dependencies.txt
      - name: Upload evidence audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recorded-evidence-audit
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  regression-gate:
    name: Regression gate
    if: always()
    needs: [core, torch-cpu, evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every regression job to succeed
        env:
          CORE_RESULT: ${{ needs.core.result }}
          TORCH_RESULT: ${{ needs.torch-cpu.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
        run: |
          printf 'Core: %s\nCPU runner: %s\nEvidence: %s\n' "$CORE_RESULT" "$TORCH_RESULT" "$EVIDENCE_RESULT"
          [[ "$CORE_RESULT" == "success" && "$TORCH_RESULT" == "success" && "$EVIDENCE_RESULT" == "success" ]]
