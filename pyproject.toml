[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kvpilot"
version = "0.1.0"
description = "An evidence-first lab for session-aware KV cache offload decisions"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
kvpilot = "kvpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
